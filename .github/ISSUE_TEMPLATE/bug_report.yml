name: Bug report
description: Report a reproducible problem with the bot.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Before submitting, check whether this issue has already been reported.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the command, options, and steps needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bot version or commit
      placeholder: "e.g. 1.0.0 or commit SHA"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, user IDs, and other private information before sharing.
      render: text
